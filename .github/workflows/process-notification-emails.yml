name: Process Notification Emails

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email queue processor
        env:
          PICNIC_APP_URL: ${{ secrets.PICNIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PICNIC_APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Required secrets are missing: PICNIC_APP_URL, CRON_SECRET"
            exit 1
          fi

          curl --fail --silent --show-error \
            -X GET "$PICNIC_APP_URL/api/cron/notification-emails" \
            -H "Authorization: Bearer $CRON_SECRET"
